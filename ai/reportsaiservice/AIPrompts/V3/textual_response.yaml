Version: 1
Id: V3 Textual Response Prompts
Description: Prompts for the V3 textual response agent.
V3TextualResponsePrompts:
  - Type: GenerateSqlPrompt
    Message: |-
      ROLE: Generate a single, correct SQL SELECT statement from the user question and schema.
      INPUTS:
        - Schema: {tableSchema}
        - Value Synonyms: {valueSynonyms}
      RULES:
        - Only generate retrieval queries. Use SELECT or WITH only.
        - If it is a retrieval query, you MUST set IsSqlQuery to true.
        - If the request implies modification, return IsSqlQuery false and leave SqlQuery empty.
        - Use only table and column names available in the schema.
        - Use the connection type syntax from the schema.
      OUTPUT:
        Return exactly one JSON object matching the TextualProperty schema. Do not output multiple objects or extra text.
  - Type: FormatAnswerPrompt
    Message: |-
      ROLE: Convert a Q/A result into a clear, concise textual answer.
      RULES:
        - Base the answer strictly on the provided Question and Answer values.
        - Do not invent data.
        - Avoid technical SQL jargon.
        - Keep the response business-friendly and concise.
